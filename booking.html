<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رزرو تبلیغ | CapCut Academy</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#07070b;
color:#fff;
font-family:Tahoma,Arial;
}
.container{
width:min(1000px,92%);
margin:auto;
padding:35px 0;
}
.back{
color:#aaa;
text-decoration:none;
}
h1{
font-size:34px;
margin:30px 0 10px;
}
.sub{
color:#aaa;
line-height:2;
}
.weeks{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-top:30px;
}
.week{
padding:22px;
background:#111119;
border:1px solid #29293a;
border-radius:18px;
cursor:pointer;
}
.week:hover{
border-color:#8b5cf6;
}
.week strong{
display:block;
font-size:19px;
margin-bottom:10px;
}
.price{
color:#a78bfa;
font-size:20px;
font-weight:bold;
}
.status{
margin-top:8px;
color:#777;
}
.form{
margin-top:30px;
padding:25px;
background:#111119;
border-radius:20px;
border:1px solid #29293a;
}
input{
width:100%;
padding:14px;
margin:8px 0;
border-radius:10px;
border:1px solid #333;
background:#08080d;
color:white;
}
button{
width:100%;
padding:15px;
margin-top:12px;
border:0;
border-radius:12px;
background:linear-gradient(90deg,#7c3aed,#06b6d4);
color:white;
font-weight:bold;
font-size:16px;
}
@media(max-width:700px){
.weeks{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<a class="back" href="index.html">← بازگشت به سایت</a>

<h1>رزرو تبلیغ</h1>

<p class="sub">
کانال، کسب‌وکار یا محصول خود را برای یک هفته در جایگاه تبلیغاتی سایت معرفی کنید.
</p>

<div class="weeks">

<div class="week" onclick="selectWeek('هفته اول')">
<strong>هفته اول</strong>
<div class="price">500 AFN</div>
<div class="status">قابل رزرو</div>
</div>

<div class="week" onclick="selectWeek('هفته دوم')">
<strong>هفته دوم</strong>
<div class="price">500 AFN</div>
<div class="status">قابل رزرو</div>
</div>

<div class="week" onclick="selectWeek('هفته سوم')">
<strong>هفته سوم</strong>
<div class="price">750 AFN</div>
<div class="status">قابل رزرو</div>
</div>

</div>

<div class="form">

<h2>اطلاعات تبلیغ</h2>

<input id="selectedWeek" placeholder="هفته انتخاب‌شده" readonly>

<input id="channel" placeholder="لینک کانال یا سایت">

<input id="name" placeholder="نام تبلیغ یا کسب‌وکار">

<input id="contact" placeholder="راه ارتباطی">

<button onclick="submitBooking()">
ثبت درخواست رزرو
</button>

<p id="result"></p>

</div>

</div>

<script>
const API_URL = "http://localhost:3000";

async function submitBooking() {
    const week = document.getElementById("week")?.value || "";
    const channel = document.getElementById("channel")?.value.trim() || "";
    const name = document.getElementById("name")?.value.trim() || "";
    const contact = document.getElementById("contact")?.value.trim() || "";

    if (!week || !channel || !name || !contact) {
        alert("لطفاً تمام اطلاعات را وارد کنید.");
        return;
    }

    try {
        const response = await fetch(`${API_URL}/api/bookings`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                week,
                channel,
                name,
                contact
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "خطا در ثبت رزرو");
        }

        alert("رزرو شما با موفقیت ثبت شد.");

        document.getElementById("channel").value = "";
        document.getElementById("name").value = "";
        document.getElementById("contact").value = "";

    } catch (error) {
        console.error(error);
        alert("اتصال به سرور برقرار نشد. لطفاً دوباره تلاش کنید.");
    }
}
</script>

</body>
</html>
