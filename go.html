<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>در حال انتقال...</title>
<style>
body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#07070b;
color:white;
font-family:Tahoma,Arial;
text-align:center;
}
.box{
padding:30px;
}
.loader{
width:45px;
height:45px;
border:4px solid #333;
border-top-color:#8b5cf6;
border-radius:50%;
animation:spin 1s linear infinite;
margin:20px auto;
}
@keyframes spin{
to{transform:rotate(360deg)}
}
</style>
</head>
<body>

<div class="box">
<h2>در حال انتقال...</h2>
<div class="loader"></div>
<p id="message">لطفاً صبر کنید</p>
</div>

<script>

fetch("ads.json")
.then(function(response){
return response.json();
})
.then(function(ad){

if(!ad.active){
throw new Error("inactive");
}

/* ثبت کلیک محلی موقت */
const key = "capcut_ad_click_" + ad.name;
const old = Number(localStorage.getItem(key) || 0);

localStorage.setItem(key, old + 1);

document.getElementById("message").textContent =
"در حال انتقال به کانال...";

setTimeout(function(){
window.location.href = ad.url;
},700);

})
.catch(function(){

document.getElementById("message").textContent =
"تبلیغ فعالی وجود ندارد.";

});

</script>

</body>
</html>
